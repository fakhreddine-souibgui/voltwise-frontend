<div class="verification-container">
  <div class="webcam-wrapper">
    <webcam 
      [trigger]="triggerObservable"
      (imageCapture)="handleAndVerify($event)"
      [videoOptions]="videoOptions"
      [mirrorImage]="'always'">
    </webcam>

  </div>
 
  <div class="controls">
    <button class="verify-button" (click)="captureAndVerify()" [disabled]="isLoading">
      🔍 Vérifier mon visage
    </button>
  </div>

  <div *ngIf="isLoading" class="loading">
    <div class="spinner"></div>
    <p>Vérification en cours...</p>
  </div>

  <p *ngIf="verificationResult === true" class="result success">
    ✅ Visage reconnu
  </p>
  <p *ngIf="verificationResult === false" class="result error">
    ❌ Visage non reconnu
  </p>

  <img *ngIf="webcamImage" [src]="webcamImage.imageAsDataUrl" class="preview" alt="Aperçu capture" />
</div>
