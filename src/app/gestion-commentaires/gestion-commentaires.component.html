<div class="form-container">
  <form>
    <div class="form-group">
      <label>Nom et prénom</label>
      <input type="text" [(ngModel)]="formData.nomPrenom" name="nomPrenom">
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="formData.email" name="email">
    </div>

    <div class="form-group">
      <label>Numéro Téléphone</label>
      <input type="text" [(ngModel)]="formData.tel1" name="tel1">
    </div>

    <div class="form-group">
      <label>Numéro Téléphone 2</label>
      <input type="text" [(ngModel)]="formData.tel2" name="tel2">
    </div>

    <div class="form-group">
      <label>Numéro de l’espace</label>
      <input type="text" [(ngModel)]="formData.espace" name="espace">
    </div>

    <div class="form-group">
      <label>Type d’espace</label>
      <input type="text" [(ngModel)]="formData.typeEspace" name="typeEspace">
    </div>

    <div class="form-group">
      <label>Gouvernorat</label>
      <input type="text" [(ngModel)]="formData.gouvernorat" name="gouvernorat">
    </div>

    <div class="form-group">
      <label>Ville</label>
      <input type="text" [(ngModel)]="formData.ville" name="ville">
    </div>

    <div class="form-group">
      <label>Date Début Publicité</label>
      <input type="date" [(ngModel)]="formData.dateDebut" name="dateDebut">
    </div>

    <div class="form-group">
      <label>Date fin Publicité</label>
      <input type="date" [(ngModel)]="formData.dateFin" name="dateFin">
    </div>
   <!--********************-->
   <video controls class="video-player">
    <source src="assets/mes images/sample.mp4" type="video/mp4">
    Votre navigateur ne supporte pas la vidéo.
  </video>
    <div class="form-group">
      <label>Statuts</label>
      <select [(ngModel)]="formData.statut" name="statut">
        <option *ngFor="let s of statuses" [value]="s">{{ s }}</option>
      </select>
    </div>

    <button type="button" class="modifier-btn" (click)="modifierPublicite()">Modifier Publicité</button>
  </form>
</div>
