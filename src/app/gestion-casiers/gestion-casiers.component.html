<div class="main-container">
  <table class="custom-table">
    <thead>
      <tr>
        <th>Locker</th>
        <th>Reference</th>
        <th>Espace Public</th>
        <th>Secteur d’activité</th>
        <th>Gouvernorat</th>
        <th>Ville</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let locker of lockers">
        <td>{{ locker.locker }}</td>
        <td>{{ locker.reference }}</td>
        <td>{{ locker.espacePublic }}</td>
        <td>{{ locker.secteur }}</td>
        <td>{{ locker.gouvernorat }}</td>
        <td>{{ locker.ville }}</td>
      </tr>
    </tbody>
  </table>

  <div class="bottom-bar">
    <div class="pagination-controls">
      <span>Page</span>
      <select [(ngModel)]="page">
        <option *ngFor="let p of [].constructor(totalPages); let i = index" [value]="i+1">
          {{ i+1 }}
        </option>
      </select>
      <span>of {{ totalPages }}</span>

      <button [disabled]="page === 1" (click)="page = page - 1">&lt;</button>
      <button *ngFor="let p of [1, 2, 3]" 
              [class.active]="page === p" 
              (click)="page = p">{{ p }}</button>
      <span>...</span>
      <button (click)="page = totalPages" [class.active]="page === totalPages">{{ totalPages }}</button>
    </div>
  </div>
</div>
