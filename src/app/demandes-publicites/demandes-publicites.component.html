<div class="main-container">
  <table class="custom-table">
    <thead>
      <tr>
        <th>User</th>
        <th>Date Debut</th>
        <th>Date Fin</th>
        <th>Espace</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let res of reservations">
        <td>{{ res.user }}</td>
        <td>{{ res.dateDebut }}</td>
        <td>{{ res.dateFin }}</td>
        <td>{{ res.espace }}</td>
        <td>{{ res.status }}</td>
        <td class="actions">
          <button class="icon-btn info" (click)="onInfoClick(res)">
            <img src="assets/mes images/info.png" alt="info">
          </button>
          <button class="icon-btn delete" (click)="onDeleteClick(res)">
            <img src="assets/mes images/remove.png" alt="delete">
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="pagination-controls">
    <span>Page</span>
    <select [(ngModel)]="page">
      <option *ngFor="let p of [].constructor(totalPages); let i = index" [value]="i+1">
        {{ i+1 }}
      </option>
    </select>
    <span>of {{ totalPages }}</span>

    <button [disabled]="page === 1" (click)="page = page - 1">&lt;</button>

    <button *ngFor="let p of [1, 2, 3]"
            [class.active]="page === p"
            (click)="page = p">{{ p }}</button>

    <span>...</span>

    <button (click)="page = totalPages"
            [class.active]="page === totalPages">{{ totalPages }}</button>
  </div>
</div>
