<button class="chatbot-icon" (click)="toggleChat()">
  💬
</button>

<div class="chat-popup" *ngIf="showChat">
  <div class="chat-header">
    <h3>Chatbot Voltwise</h3>
    <button class="close-btn" (click)="toggleChat()">✖</button>
  </div>

  <form (ngSubmit)="onSubmit()" enctype="multipart/form-data">
    <label for="message">Message :</label>
    <input
      type="text"
      id="message"
      [(ngModel)]="message"
      name="message"
      required
      placeholder="Tapez votre message ici..."
    />

    <label class="custom-file-upload" for="image">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        height="20"
        viewBox="0 0 24 24"
        width="20"
        fill="#007bff"
        style="vertical-align: middle; margin-right: 6px;"
      >
        <path d="M5 20h14v-2H5v2zm7-18L5.33 9h3.34v6h6.66v-6h3.34L12 2z" />
      </svg>
      Choisir une image
    </label>
    <input
      type="file"
      id="image"
      (change)="onFileSelected($event)"
      accept="image/*"
      hidden
    />

    <div class="image-preview" *ngIf="selectedFile">
      <img [src]="imagePreview" alt="Prévisualisation image" />
      <button type="button" class="remove-btn" (click)="removeImage()">
        ✖
      </button>
    </div>

<button type="submit" [disabled]="loading" *ngIf="!loading">Envoyer</button>

<div *ngIf="loading" class="spinner"></div>
  </form>

  <div *ngIf="response" class="response-box">
    <h4>Réponse :</h4>
    <pre>{{ response }}</pre>
  </div>
</div>
